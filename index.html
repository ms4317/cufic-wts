<!DOCTYPE html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- 확대 제한 없음(저시력 사용자의 핀치 줌 보장).
         더블탭 줌은 인터랙티브 요소의 touch-action: manipulation으로 막는다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cufic WTS</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f0454b'/><path d='M8 21l5-6 4 4 7-8' stroke='%23e8b45c' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />
    <script>
      // 저장된 테마를 첫 페인트 전에 적용 (깜빡임 방지)
      try {
        var t = localStorage.getItem('wts-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
